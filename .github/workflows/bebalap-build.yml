name: Bebalap Android - Debug APK & Signed AAB

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version name untuk release Play Store'
        required: true
        default: '1.0.0'
        type: string
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

env:
  GRADLE_VERSION: '8.13'
  JAVA_VERSION: '17'
  ANDROID_API: '36'
  BEBALAP_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}

jobs:
  debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=""
          for candidate in \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager tidak ditemukan pada GitHub runner."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-${ANDROID_API}"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Bebalap-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  signed-playstore-aab:
    name: Build Signed Play Store AAB
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=""
          for candidate in \
            "${ANDROID_SDK_ROOT:-}/cmdline-tools/latest/bin/sdkmanager" \
            "${ANDROID_HOME:-}/cmdline-tools/latest/bin/sdkmanager" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [[ -n "$candidate" && -x "$candidate" ]]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager tidak ditemukan pada GitHub runner."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-${ANDROID_API}"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Prepare Play Store signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [[ -z "${KEYSTORE_BASE64:-}" ]]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 belum dibuat."
            exit 1
          fi
          if [[ -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo "Secret ANDROID_KEYSTORE_PASSWORD belum dibuat."
            exit 1
          fi
          if [[ -z "${KEY_ALIAS:-}" ]]; then
            echo "Secret ANDROID_KEY_ALIAS belum dibuat."
            exit 1
          fi
          if [[ -z "${KEY_PASSWORD:-}" ]]; then
            echo "Secret ANDROID_KEY_PASSWORD belum dibuat."
            exit 1
          fi

          KEYSTORE_PATH="$RUNNER_TEMP/bebalap-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          keytool -list \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null

          {
            echo "BEBALAP_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "BEBALAP_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "BEBALAP_KEY_ALIAS=$KEY_ALIAS"
            echo "BEBALAP_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

          echo "Keystore release valid."

      - name: Build Signed AAB
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace :app:bundleRelease

      - name: Verify AAB signature
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          if [[ -z "$AAB" || ! -f "$AAB" ]]; then
            echo "AAB release tidak ditemukan."
            exit 1
          fi

          jarsigner -verify "$AAB" >/dev/null
          echo "Signed AAB verified: $AAB"

      - name: Rename Play Store AAB
        shell: bash
        run: |
          set -euo pipefail
          AAB="$(find app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' | head -n 1)"
          cp "$AAB" "$RUNNER_TEMP/Bebalap-${BEBALAP_VERSION_NAME}-playstore.aab"

      - name: Upload Signed Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: Bebalap-signed-playstore-aab-${{ env.BEBALAP_VERSION_NAME }}
          path: ${{ runner.temp }}/Bebalap-${{ env.BEBALAP_VERSION_NAME }}-playstore.aab
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        shell: bash
        run: |
          {
            echo "## Bebalap Play Store Build"
            echo ""
            echo "- Package: \`app.bebalap.id\`"
            echo "- Version name: \`${BEBALAP_VERSION_NAME}\`"
            echo "- Target SDK: \`${ANDROID_API}\`"
            echo "- AAB: **SIGNED dan signature sudah diverifikasi**"
            echo ""
            echo "Download dari bagian **Artifacts** pada workflow run ini."
          } >> "$GITHUB_STEP_SUMMARY"
